# E1-Repair and E1-Audit corpus: 12 accessible base pages x 4 faulty variants
# = 48 faulty pages, each with k = 4 injected faults (192 faults in total).
#
# Base pages must be self-contained single HTML files (inline CSS/JS, local image
# paths only) and must pass, BEFORE any mutation:
#   (a) zero axe-core violations for tags wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa
#   (b) all generic probes (tab_reachability, focus_visible, no_keyboard_trap)
#   (c) the operator-specific "resolved" check for every target listed for it
# Every mutation target must carry a stable, descriptive id (e.g. id="search-submit").
# Ids must not mention accessibility (no "a11y", "alt", "aria" in id names).

base_pages:

  # Provenance W3C: adapted from the W3C WAI Before-and-After Demonstration (BAD),
  # https://www.w3.org/WAI/demos/bad/ ("after", i.e. accessible, versions).
  # Inline the CSS, copy images to images/, strip the demo toolbar/annotations,
  # add ids to targets. If a page fails (a) under current axe-core, make the
  # smallest fix that passes and record each fix in DEVIATIONS.md. Credit W3C
  # in the paper (already cited as w3cbad). If any BAD page cannot be made to
  # pass in under ~1 hour, replace it with an extra authored page and log it.
  - {id: B01, provenance: w3c, source: "https://www.w3.org/WAI/demos/bad/after/home.html"}
  - {id: B02, provenance: w3c, source: "https://www.w3.org/WAI/demos/bad/after/news.html"}
  - {id: B03, provenance: w3c, source: "https://www.w3.org/WAI/demos/bad/after/tickets.html"}
  - {id: B04, provenance: w3c, source: "https://www.w3.org/WAI/demos/bad/after/survey.html"}

  # Provenance authored: written for this study (by the author with LLM help),
  # reviewed by the author, formatted with prettier, 150-400 lines each.
  - id: B05
    provenance: authored
    spec: >-
      CityCare home page: header with text logo, main nav (5 links) and a search form
      (labelled input + icon-only submit button), hero section with an informative photo,
      three service cards each with an icon link, a "Latest news" list with thumbnail
      images, footer with contact details, icon-only social links and a newsletter form.
  - id: B06
    provenance: authored
    spec: >-
      Appointment request form page: labelled inputs, a radio group in a fieldset with a
      legend, a select, a textarea, a consent checkbox, a submit button, and an error
      summary that lists problems as links to the fields (shown on invalid submit).
  - id: B07
    provenance: authored
    spec: >-
      Clinic locations page: opening-hours table with th scope attributes and caption,
      a map image with a text alternative, an address list, and "Get directions" links
      whose text makes their purpose clear.
  - id: B08
    provenance: authored
    spec: >-
      Sign-in page: username and password fields, an icon-only show/hide password button
      (aria-pressed), a "Remember me" checkbox, "Forgot your password?" link, submit button.
  - id: B09
    provenance: authored
    spec: >-
      Search results page with filters: checkbox group in a fieldset, a sort select, ten
      results with headings and links, and pagination nav with aria-current on page 1.
  - id: B10
    provenance: authored
    spec: >-
      Patient dashboard: summary cards, an upcoming-appointments table, two notification
      toggles (role=switch), a status region announcing "Settings saved", icon-only
      edit and delete buttons.
  - id: B11
    provenance: authored
    spec: >-
      Health article page: breadcrumb nav, h1-h3 hierarchy, a figure with an informative
      image and figcaption, a print button, and a "Was this page helpful?" yes/no widget.
  - id: B12
    provenance: authored
    spec: >-
      Event registration page: date and time inputs, a radio group, a "Show accessibility
      options" button that toggles a details panel (aria-expanded), and a modal
      confirmation dialog.

# Every authored page (B05-B12) must contain a target for EVERY operator below.
# W3C pages need targets for at least 8 operators (add ids; do not add new content
# beyond what an operator needs, and log any addition).

operators:
  - id: M01
    name: img-alt-remove
    sc: ["1.1.1"]
    target: "informative <img> with non-empty alt"
    mutate: "remove the alt attribute"
    detect: "axe image-alt on the target"
    resolved: "an <img> with the same src exists and has a non-empty accessible name"
  - id: M02
    name: label-to-placeholder
    sc: ["1.3.1", "3.3.2", "4.1.2"]
    target: "text input with an associated <label for>"
    mutate: "delete the <label>; add placeholder=<former label text>"
    detect: "custom: input name comes only from placeholder or is empty"
    resolved: "input (same id) has a name from <label>, aria-label or aria-labelledby"
  - id: M03
    name: contrast-reduce
    sc: ["1.4.3"]
    target: "a paragraph of body text (not large text)"
    mutate: "set inline color so contrast against its background is 2.5:1 (+/- 0.1)"
    detect: "axe color-contrast on the target"
    resolved: "target text contrast >= 4.5:1"
  - id: M04
    name: iconbutton-name-remove
    sc: ["4.1.2"]
    target: "icon-only <button> named by aria-label or visually hidden text"
    mutate: "remove the aria-label / hidden text (keep the icon)"
    detect: "axe button-name"
    resolved: "button (same id) has a non-empty accessible name"
  - id: M05
    name: iconlink-name-remove
    sc: ["2.4.4", "4.1.2"]
    target: "icon-only link named by aria-label or hidden text"
    mutate: "remove the name source"
    detect: "axe link-name"
    resolved: "link (same id) has a non-empty accessible name"
  - id: M06
    name: lang-remove
    sc: ["3.1.1"]
    target: "<html lang>"
    mutate: "remove the lang attribute"
    detect: "axe html-has-lang"
    resolved: "<html> has a valid lang"
  - id: M07
    name: button-to-div
    sc: ["2.1.1", "4.1.2"]
    target: "<button> whose click toggles a visible panel"
    mutate: "replace with <div> keeping id, classes, text and click handler; no role, tabindex or key handling"
    detect: "custom probe keyboard_activation"
    resolved: "element (same id) is reachable with Tab, exposes role button, and Enter AND Space toggle the panel"
  - id: M08
    name: heading-demote
    sc: ["1.3.1"]
    target: "an <h2>"
    mutate: "replace with <div> styled to look identical"
    detect: "custom: heading outline differs from base"
    resolved: "the text is again inside a heading element and no level is skipped"
  - id: M09
    name: tabindex-positive
    sc: ["2.4.3"]
    target: "a link in the footer"
    mutate: "add tabindex=\"3\""
    detect: "custom: any element with tabindex > 0"
    resolved: "no element has tabindex > 0"
  - id: M10
    name: focus-indicator-remove
    sc: ["2.4.7"]
    target: "page stylesheet"
    mutate: "append a rule removing outline on :focus and :focus-visible for a, button, input, select, textarea, with no replacement"
    detect: "custom probe focus_visible"
    resolved: "focus_visible passes for all sampled focusable elements"
  - id: M11
    name: aria-invalid-attr
    sc: ["4.1.2"]
    target: "a button or toggle"
    mutate: "one of: role=\"buton\"; aria-expanded=\"yes\"; aria-checked on a plain <button> (seeded choice)"
    detect: "axe aria-roles / aria-valid-attr-value / aria-allowed-attr"
    resolved: "the corresponding axe rule passes for the target"
  - id: M12
    name: title-remove
    sc: ["2.4.2"]
    target: "<title>"
    mutate: "remove the <title> element"
    detect: "axe document-title"
    resolved: "document has a non-empty <title>"

variants:
  per_base_page: 4
  faults_per_variant: 4
  seed: 20271113
  constraints:
    - "operators within a variant are distinct and never target the same element"
    - "across all 48 variants, each operator appears 16 +/- 2 times (stratified assignment)"
    - "after mutation, every injected fault must be DETECTED by its detect check; regenerate the variant otherwise"
    - "store ground truth per variant: operator id, target id, accepted SCs"
