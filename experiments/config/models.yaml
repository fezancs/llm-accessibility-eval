# Model registry for the SE4All 2027 study.
#
# Prices are USD per 1M tokens, collected on 2026-10-28 from the sources listed.
# They WILL drift. On the day you run each experiment, re-check every price on
# the provider's own pricing page, update this file, and commit it before the
# run (the analysis reads prices from here, and the paper reports this date).
#
# family  = the vendor family used for judge recusal in CMBPE (Experiment E3).
# roles   = which experiments use the model:
#           e1        capability tasks (generation, repair, audit)
#           e2        long agentic sessions (DCDI)
#           e3_gen    alt-text generator
#           e3_judge  member of the CMBPE jury
# tier    = core (must run) | optional (run only if budget allows; see budget.yaml)
#
# IDs: "provider_model_id" is the ID for the vendor's own API. "openrouter_id"
# is a best guess and MUST be verified against https://openrouter.ai/api/v1/models
# before use. Always log the model name the API returns in every response.

snapshot_date: "2026-10-28"

models:

  # ---------------- Anthropic ----------------
  - key: claude-opus-5-5
    display: "Claude Opus 5.5"
    family: anthropic
    access: closed
    tier: core
    provider: anthropic
    provider_model_id: claude-opus-5-5
    openrouter_id: "anthropic/claude-opus-5.5"      # verify
    released: "2026-09-22"
    vision: true
    context_tokens: 1000000
    max_output_tokens: 128000
    architecture: "undisclosed"
    test_time_compute: "adaptive thinking; effort param (default medium)"
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00}
    price_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    roles: [e1, e2, e3_gen]

  - key: claude-sonnet-5-5
    display: "Claude Sonnet 5.5"
    family: anthropic
    access: closed
    tier: core
    provider: anthropic
    provider_model_id: claude-sonnet-5-5
    openrouter_id: "anthropic/claude-sonnet-5.5"    # verify
    released: "2026-09-28"
    vision: true
    context_tokens: 1000000
    max_output_tokens: 128000
    architecture: "undisclosed"
    test_time_compute: "adaptive thinking; effort param (default high)"
    price: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50}
    price_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    roles: [e1, e3_judge]

  - key: claude-haiku-5-5
    display: "Claude Haiku 5.5"
    family: anthropic
    access: closed
    tier: core
    provider: anthropic
    provider_model_id: claude-haiku-5-5
    openrouter_id: "anthropic/claude-haiku-5.5"     # verify
    released: "2026-10-07"
    vision: true
    context_tokens: 1000000
    max_output_tokens: 128000
    architecture: "undisclosed"
    test_time_compute: "adaptive thinking; effort param (default medium)"
    # Tiered: prompts up to 100k tokens / prompts over 100k tokens.
    price: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write_5m: 0.125}
    price_over_100k: {input: 0.50, output: 2.50, cache_read: 0.05, cache_write_5m: 0.625}
    price_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    roles: [e1, e2, e3_gen]

  - key: claude-fable-5-1
    display: "Claude Fable 5.1"
    family: anthropic
    access: closed
    tier: optional            # frontier ceiling for E1 only
    provider: anthropic
    provider_model_id: claude-fable-5-1
    openrouter_id: "anthropic/claude-fable-5.1"     # verify
    released: "2026"          # verify exact date on the model page
    vision: true
    context_tokens: 1000000
    max_output_tokens: 128000
    architecture: "undisclosed"
    test_time_compute: "adaptive thinking, always on (default effort high)"
    price: {input: 10.00, output: 50.00, cache_read: 0.25, cache_write_5m: 12.50}
    price_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    roles: [e1]

  # ---------------- OpenAI ----------------
  - key: gpt-6-sol
    display: "GPT-6 Sol"
    family: openai
    access: closed
    tier: core
    provider: openai
    provider_model_id: gpt-6-sol                     # verify in OpenAI docs
