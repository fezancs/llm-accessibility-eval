    vision: true
    context_tokens: 1050000
    max_output_tokens: 128000
    architecture: "undisclosed"
    test_time_compute: "reasoning effort none..max (default medium)"
    price: {input: 2.00, output: 10.00, cache_read: 0.20}
    price_source: "OpenAI model listing as reported by https://www.requesty.ai/blog/gpt-6-sol-luna-pricing-release-api (verify on OpenAI pricing page)"
    note: "GPT-6.1 Sol (2026-09-29) exists; pick ONE Sol snapshot, pin it, and report it."
