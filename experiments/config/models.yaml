    vision: true
    context_tokens: null      # verify
    max_output_tokens: 1000000
    architecture: "undisclosed"
    test_time_compute: "thinking (verify controls)"
    # Introductory price through 2026-11-30, then 4.00/20.00. Cached input 95% off.
    price: {input: 2.00, output: 10.00, cache_read: 0.10}
    price_source: "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/"
