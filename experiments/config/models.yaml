  # ---------------- Open-weight ----------------
  - key: deepseek-v4-pro
    display: "DeepSeek V4-Pro"
    family: deepseek
    access: open              # MIT licence
    tier: core
    provider: deepseek
    provider_model_id: "VERIFY (V4-Pro-0813 snapshot)"
    openrouter_id: "deepseek/deepseek-v4-pro"        # verify
    released: "2026-08-13"
    vision: false             # verify; treat as text-only unless documented otherwise
    context_tokens: 1000000
    architecture: "sparse MoE, 1.6T total / 49B active"
    test_time_compute: "non-thinking / high / max"
    # DeepSeek bills peak vs off-peak (peak 01-04 and 06-10 UTC, Mon-Fri). Run off-peak if you can,
    # and record which window each call fell in.
    price: {input: 1.32, output: 3.96, cache_read: 0.044}
    price_offpeak: {input: 0.66, output: 1.98, cache_read: 0.022}
    price_source: "https://www.yottalabs.ai/post/deepseek-v4-release-date-specs-how-to-access-2026 (verify on DeepSeek pricing page)"
