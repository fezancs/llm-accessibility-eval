# Spend caps (USD). The harness must track cumulative billed cost per experiment
# from logged token counts x prices in models.yaml, and STOP (not skip silently)
# when a cap is reached, then ask the author how to proceed.
#
# Estimates below assume prompt caching is used where the provider supports it.
# They are planning numbers, not guarantees; the pilot run (CLAUDE.md, Phase 2)
# produces a per-call cost table that you should use to re-estimate before Phase 3.

profile: full        # full | lean

caps:
  pilot: 25
  e1: 120            # lean: 40   (core models only; optional ceilings add ~ $105)
  e2: 160            # lean: 50   (5 models x 2 runs)
  e3: 110            # lean: 35   (80 images x 12 pairs)
  contingency: 60    # retries, re-runs after bug fixes

lean_profile:
  e1_models: [claude-opus-5-5, claude-haiku-5-5, gpt-6-sol, gpt-6-luna,
              gemini-3-8-flash, deepseek-v4-pro, qwen3-8-27b, llama-4-maverick]
  e2_models: [claude-opus-5-5, claude-haiku-5-5, gpt-6-sol, gemini-3-8-flash, qwen3-8-27b]
  e2_runs: 2
  e3_images: 80
  e3_pairs_per_image: 12
