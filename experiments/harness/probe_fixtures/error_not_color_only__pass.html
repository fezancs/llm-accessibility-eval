<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<h1>Form</h1><form id="f" novalidate><p><label for="name">Full name</label><input id="name" aria-describedby="name-err" aria-required="true"><span id="name-err" hidden></span></p><p><label for="email">Email</label><input id="email" type="email" aria-describedby="email-err" aria-required="true"><span id="email-err" hidden></span></p><button>Request appointment</button></form><script>const f=document.getElementById("f");f.addEventListener("submit",e=>{e.preventDefault();for(const id of ["name","email"]){const i=document.getElementById(id),m=document.getElementById(id+"-err");if(!i.value){i.setAttribute("aria-invalid","true");m.textContent="Enter your "+id+".";m.hidden=false;}}});</script>
</main></body></html>
