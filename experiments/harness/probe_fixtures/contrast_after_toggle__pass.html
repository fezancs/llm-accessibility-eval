<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<style>.dark{background:#111;color:#eee}.dark button{background:#333;color:#fff}</style><header><button id="theme-toggle" role="switch" aria-checked="false">Dark mode</button></header><main><h1>Home</h1><p>Welcome to CityCare.</p></main><script>const t=document.getElementById("theme-toggle");t.onclick=()=>{const on=t.getAttribute("aria-checked")!=="true";t.setAttribute("aria-checked",on);document.body.classList.toggle("dark",on);};</script>
</body></html>
