<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<style>.tt{position:relative;display:inline-block}.tip{display:none;position:absolute;left:0;top:100%;background:#222;color:#fff;padding:.5rem;width:16rem;margin-top:0}.tt.open .tip{display:block}</style><main><h1>ID</h1><label for="pid">Patient ID number</label> <span class="tt" id="w"><button type="button" id="q" aria-describedby="tip" aria-label="Help">?</button><span role="tooltip" id="tip" class="tip">Your 10-digit patient ID is printed on your clinic card.</span></span> <input id="pid"><script>const w=document.getElementById("w"),q=document.getElementById("q");const o=()=>w.classList.add("open"),c=()=>w.classList.remove("open");q.addEventListener("focus",o);q.addEventListener("blur",c);w.addEventListener("mouseenter",o);w.addEventListener("mouseleave",c);document.addEventListener("keydown",e=>{if(e.key==="Escape")c();});</script></main>
