<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<h1>FAQ</h1><h3><button aria-expanded="false" aria-controls="a1">How do I book an appointment?</button></h3><div id="a1" hidden><p>Answer 1.</p></div><h3><button aria-expanded="false" aria-controls="a2">Is parking available?</button></h3><div id="a2" hidden><p>Answer 2.</p></div><script>document.querySelectorAll('h3 button').forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);document.getElementById(b.getAttribute('aria-controls')).hidden=o;});</script>
</main></body></html>
