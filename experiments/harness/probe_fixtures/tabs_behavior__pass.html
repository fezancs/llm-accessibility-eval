<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<h1>Services</h1><div role="tablist" aria-label="Services"><button role="tab" id="t1" aria-selected="true" aria-controls="p1">Vaccinations</button><button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">Check-ups</button><button role="tab" id="t3" aria-selected="false" aria-controls="p3" tabindex="-1">Pharmacy</button></div><div role="tabpanel" id="p1" aria-labelledby="t1"><h2>Vaccinations</h2><p>Text.</p></div><div role="tabpanel" id="p2" aria-labelledby="t2" hidden><h2>Check-ups</h2><p>Text.</p></div><div role="tabpanel" id="p3" aria-labelledby="t3" hidden><h2>Pharmacy</h2><p>Text.</p></div><script>const tabs=[...document.querySelectorAll("[role=tab]")];function sel(t){tabs.forEach(x=>{const on=x===t;x.setAttribute("aria-selected",on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute("aria-controls")).hidden=!on;});t.focus();}tabs.forEach((t,i)=>{t.onclick=()=>sel(t);t.onkeydown=e=>{if(e.key==="ArrowRight")sel(tabs[(i+1)%3]);if(e.key==="ArrowLeft")sel(tabs[(i+2)%3]);};});</script>
</main></body></html>
