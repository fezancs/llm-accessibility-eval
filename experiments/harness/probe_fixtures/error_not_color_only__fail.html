<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<h1>Form</h1><form id="f" novalidate><p><label for="name">Full name</label><input id="name" required></p><p><label for="email">Email</label><input id="email" type="email" required></p><button>Request appointment</button></form><script>document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();document.querySelectorAll("input").forEach(i=>{if(!i.value){i.style.border="2px solid #c00";i.setAttribute("aria-invalid","true");}});});</script>
</main></body></html>
