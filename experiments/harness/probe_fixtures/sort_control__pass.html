<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<main><h1>Hours</h1><table><caption>Opening hours</caption><thead><tr><th scope="col" id="ch" aria-sort="none"><button id="sb">Clinic</button></th><th scope="col">Monday</th></tr></thead><tbody id="tb"><tr><th scope="row">Old Town</th><td>8-18</td></tr><tr><th scope="row">Harbour</th><td>9-17</td></tr><tr><th scope="row">Northside</th><td>Closed</td></tr></tbody></table></main><script>let asc=true;document.getElementById('sb').onclick=()=>{const tb=document.getElementById('tb');const r=[...tb.rows].sort((a,b)=>a.cells[0].textContent.localeCompare(b.cells[0].textContent)*(asc?1:-1));r.forEach(x=>tb.append(x));document.getElementById('ch').setAttribute('aria-sort',asc?'ascending':'descending');asc=!asc;};</script>
</body></html>
