<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<main><h1>Search</h1><label for="q">Search services</label><input id="q" role="combobox" aria-expanded="false" aria-controls="lb" aria-autocomplete="list"><ul id="lb" role="listbox" hidden></ul><script>const S=["Vaccinations","Eye tests","Hearing tests","Pharmacy"];const q=document.getElementById("q"),lb=document.getElementById("lb");let act=-1;function render(){const m=S.filter(s=>s.toLowerCase().includes(q.value.toLowerCase()));lb.innerHTML=m.map((s,i)=>`<li role="option" id="o${i}">${s}</li>`).join("");lb.hidden=!m.length||!q.value;q.setAttribute("aria-expanded",!lb.hidden);act=-1;q.removeAttribute("aria-activedescendant");}q.oninput=render;q.onkeydown=e=>{const o=[...lb.children];if(e.key==="ArrowDown"&&o.length){act=(act+1)%o.length;o.forEach((x,i)=>x.setAttribute("aria-selected",i===act));q.setAttribute("aria-activedescendant",o[act].id);e.preventDefault();}if(e.key==="Enter"&&act>=0){q.value=o[act].textContent;lb.hidden=true;q.setAttribute("aria-expanded","false");e.preventDefault();}};lb.onclick=e=>{q.value=e.target.textContent;lb.hidden=true;};</script></main>
</body></html>
