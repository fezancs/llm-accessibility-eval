<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<h1>Appointment</h1><button id="t">Cancel appointment</button><div id="d" role="dialog" aria-modal="true" aria-labelledby="dh" hidden style="border:2px solid #333;padding:1rem"><h2 id="dh">Cancel?</h2><button id="y">Yes, cancel</button> <button id="k">Keep appointment</button></div><script>const t=document.getElementById("t"),d=document.getElementById("d");function close(){d.hidden=true;t.focus();}t.addEventListener("click",()=>{d.hidden=false;document.getElementById("y").focus();});document.getElementById("y").onclick=close;document.getElementById("k").onclick=close;d.addEventListener("keydown",e=>{const b=[...d.querySelectorAll("button")];if(e.key==="Escape")close();if(e.key==="Tab"){const i=b.indexOf(document.activeElement);e.preventDefault();b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus();}});</script>
</main></body></html>
