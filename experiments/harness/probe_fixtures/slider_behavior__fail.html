<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<main><h1>Pain</h1><p>Pain level: No pain</p><div id="track" style="width:300px;height:10px;background:#ccc;position:relative"><div id="thumb" style="position:absolute;left:0;top:-5px;width:20px;height:20px;background:#333;cursor:pointer"></div></div><span id="pv">0</span><script>track.onclick=e=>{const v=Math.round((e.offsetX/300)*10);thumb.style.left=v*28+"px";pv.textContent=v;};</script></main>
</body></html>
