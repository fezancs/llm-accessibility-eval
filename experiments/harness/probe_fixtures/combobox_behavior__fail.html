<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font:16px/1.5 sans-serif;color:#222;background:#fff;margin:1rem}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body>
<main><h1>Search</h1><input id="q" placeholder="Search services"><div id="lb"></div><script>const S=["Vaccinations","Eye tests","Hearing tests","Pharmacy"];const q=document.getElementById("q"),lb=document.getElementById("lb");q.oninput=()=>{lb.innerHTML=S.filter(s=>q.value&&s.toLowerCase().includes(q.value.toLowerCase())).map(s=>`<div class="opt" style="cursor:pointer">${s}</div>`).join("");};lb.onclick=e=>{q.value=e.target.textContent;lb.innerHTML="";};</script></main>
</body></html>
