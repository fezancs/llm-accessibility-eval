<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityCare Appointment Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .form-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .error {
      color: #d9534f;
      display: none;
      margin-top: 5px;
      font-size: 0.9em;
    }
    button {
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>CityCare Appointment Request</h2>
    <form id="appointmentForm" onsubmit="return validateForm(event)">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required />
        <div id="fullNameError" class="error"></div>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required />
        <div id="dobError" class="error"></div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
        <div id="emailError" class="error"></div>
      </div>
      <div class="form-group">
        <label for="clinic">Preferred Clinic</label>
        <select id="clinic" name="clinic" required>
          <option value="">Select a clinic</option>
          <option value="Northside">Northside</option>
          <option value="Riverside">Riverside</option>
          <option value="Old Town">Old Town</option>
          <option value="Harbour">Harbour</option>
        </select>
        <div id="clinicError" class="error"></div>
      </div>
      <div class="form-group">
        <label for="consultationType">Consultation Type</label>
        <div class="radio-group">
          <label>
            <input type="radio" id="inPerson" name="consultationType" value="in-person" required />
            In Person
          </label>
          <label>
            <input type="radio" id="videoCall" name="consultationType" value="video call" />
            Video Call
          </label>
          <label>
            <input type="radio" id="phoneCall" name="consultationType" value="phone call" />
            Phone Call
          </label>
        </div>
        <div id="consultationTypeError" class="error"></div>
      </div>
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="privacy" name="privacy" required />
          I agree to the privacy notice.
        </label>
        <div id="privacyError" class="error"></div>
      </div>
      <button type="submit">Request Appointment</button>
    </form>
  </div>

  <script>
    function validateForm(event) {
      let isValid = true;
      const form = event.target;
      const fields = form.querySelectorAll('[required]');
      const errorMessages = {
        'fullname': 'Full name is required.',
        'dob': 'Date of birth is required.',
        'email': 'Email address is required.',
        'clinic': 'Preferred clinic is required.',
        'privacy': 'You must agree to the privacy notice.'
      };

      fields.forEach(field => {
        const errorDiv = document.getElementById(field.id + 'Error');
        if (!field.checkValidity()) {
          isValid = false;
          errorDiv.textContent = errorMessages[field.id] || 'Please fill out this field.';
          errorDiv.style.display = 'block';
        } else {
          errorDiv.style.display = 'none';
        }
      });

      if (!isValid) {
        event.preventDefault();
      }
      return isValid;
    }
  </script>
</body>
</html>
