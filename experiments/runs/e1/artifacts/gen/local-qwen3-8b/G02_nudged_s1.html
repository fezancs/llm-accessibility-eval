<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointment Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .appointment-card {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            max-width: 300px;
            margin: 0 auto;
            text-align: center;
        }
        .appointment-card button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 300px;
        }
        .modal-content h2 {
            margin-top: 0;
        }
        .modal-content p {
            margin: 10px 0 20px;
        }
        .modal-content button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }
        .message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="appointment-card">
        <p><strong>Date:</strong> Tuesday 12 March</p>
        <p><strong>Time:</strong> 10:30</p>
        <p><strong>Clinic:</strong> Riverside clinic</p>
        <button id="cancelBtn">Cancel appointment</button>
    </div>

    <div class="modal" id="modal" role="dialog" aria-labelledby="modalTitle" aria-describedby="modalDesc">
        <div class="modal-content">
            <h2 id="modalTitle">Are you sure you want to cancel your appointment?</h2>
            <p id="modalDesc">on 12 March at 10:30?</p>
            <button id="yesBtn">Yes, cancel</button>
            <button id="keepBtn">Keep appointment</button>
        </div>
    </div>

    <p id="message" class="message" style="display: none;">Your appointment has been cancelled.</p>

    <script>
        const cancelBtn = document.getElementById('cancelBtn');
        const modal = document.getElementById('modal');
        const yesBtn = document.getElementById('yesBtn');
        const keepBtn = document.getElementById('keepBtn');
        const message = document.getElementById('message');

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            yesBtn.focus();
        });

        yesBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            message.style.display = 'block';
        });

        keepBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
