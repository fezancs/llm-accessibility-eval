<!DOCTYPE html>
<html>
<head>
    <title>Flu Vaccine Eligibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #container {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            color: green;
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>Flu Vaccine Eligibility Checker</h2>
        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age" required>
        <label for="postcode">Postcode:</label>
        <input type="text" id="postcode" placeholder="Enter your postcode" required>
        <button onclick="checkEligibility()">Check eligibility</button>
        <div id="message"></div>
    </div>
    <script>
        function checkEligibility() {
            const age = parseInt(document.getElementById('age').value);
            const messageDiv = document.getElementById('message');
            if (isNaN(age) || age < 65) {
                messageDiv.textContent = 'You are not eligible for a free flu vaccination.';
                messageDiv.style.color = 'red';
            } else {
                messageDiv.textContent = 'You are eligible for a free flu vaccination.';
                messageDiv.style.color = 'green';
            }
        }
    </script>
</body>
</html>
