<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointment Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .appointment-card {
      background-color: #fff;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 300px;
      margin: auto;
    }
    .appointment-card h2 {
      margin-top: 0;
    }
    .appointment-card p {
      margin: 5px 0;
    }
    .appointment-card button {
      margin-top: 15px;
      padding: 10px 15px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .appointment-card button:hover {
      background-color: #0056b3;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 300px;
    }
    .modal h3 {
      margin: 0 0 15px 0;
    }
    .modal button {
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      width: 100%;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .modal button:hover {
      background-color: #a71f34;
    }
    .confirmation-message {
      margin-top: 20px;
      font-size: 18px;
      color: #28a745;
      display: none;
    }
  </style>
</head>
<body>
  <div class="appointment-card">
    <h2>Appointment Details</h2>
    <p>Tuesday, 12 March at 10:30</p>
    <p>Riverside Clinic</p>
    <button id="cancelBtn">Cancel appointment</button>
  </div>

  <div id="modal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true" aria-hidden="true">
    <div>
      <h3 id="modalTitle">Are you sure you want to cancel your appointment on 12 March at 10:30?</h3>
      <button id="yesBtn">Yes, cancel</button>
      <button id="noBtn">Keep appointment</button>
    </div>
  </div>

  <div id="confirmationMessage" class="confirmation-message" aria-live="polite" hidden>
    Your appointment has been cancelled.
  </div>

  <script>
    const cancelBtn = document.getElementById('cancelBtn');
    const modal = document.getElementById('modal');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const confirmationMessage = document.getElementById('confirmationMessage');

    function showModal() {
      modal.style.display = 'block';
      modal.setAttribute('aria-hidden', 'false');
      modal.querySelector('button').focus();
    }

    function hideModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
    }

    function showConfirmationMessage() {
      confirmationMessage.hidden = false;
    }

    cancelBtn.addEventListener('click', showModal);

    yesBtn.addEventListener('click', () => {
      hideModal();
      showConfirmationMessage();
    });

    noBtn.addEventListener('click', hideModal);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.style.display === 'block') {
        hideModal();
      }
    });
  </script>
</body>
</html>
