<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flu Search Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }
    main {
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 15px;
    }
    a {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    p {
      margin: 5px 0 0;
      color: #555;
    }
    nav {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    nav button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    nav button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    nav a {
      padding: 10px 15px;
      font-size: 16px;
      text-decoration: none;
      color: #007bff;
    }
    nav a:hover {
      text-decoration: underline;
    }
    nav a.current {
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Flu Search Results</h1>
    <ul id="results"></ul>
  </main>
  <nav aria-label="Pagination">
    <button id="prevBtn" aria-label="Go to previous page">Previous</button>
    <a href="#" id="page1">1</a>
    <a href="#" id="page2">2</a>
    <a href="#" id="page3">3</a>
    <a href="#" id="page4">4</a>
    <a href="#" id="page5">5</a>
    <button id="nextBtn" aria-label="Go to next page">Next</button>
  </nav>
  <script>
    const resultsContainer = document.getElementById('results');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageLinks = document.querySelectorAll('#pagination a');

    // Sample data (50 results)
    const data = Array.from({ length: 50 }, (_, i) => ({
      title: `Result ${i + 1}`,
      summary: `Summary for result ${i + 1}`
    }));

    let currentPage = 1;

    function showResults() {
      const start = (currentPage - 1) * 10;
      const end = start + 10;
      const currentResults = data.slice(start, end);

      resultsContainer.innerHTML = currentResults
        .map((result, index) => `
          <li>
            <a href="#" aria-label="View ${result.title}">${result.title}</a>
            <p>${result.summary}</p>
          </li>
        `).join('');
    }

    function updatePagination() {
      const totalPages = Math.ceil(data.length / 10);
      const pageNumbers = Array.from({ length: totalPages }, (_, i) => i + 1);

      // Update page links
      pageLinks.forEach((link, index) => {
        link.textContent = pageNumbers[index];
        link.href = `javascript:void(0)`;
        link.addEventListener('click', (e) => {
          e.preventDefault();
          currentPage = pageNumbers[index];
          showResults();
        });
        if (currentPage === pageNumbers[index]) {
          link.classList.add('current');
          link.setAttribute('aria-current', 'page');
        } else {
          link.classList.remove('current');
          link.removeAttribute('aria-current');
        }
      });

      // Update Previous and Next buttons
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          showResults();
        }
      };
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          showResults();
        }
      };
    }

    // Initialize
    showResults();
    updatePagination();
  </script>
</body>
</html>
