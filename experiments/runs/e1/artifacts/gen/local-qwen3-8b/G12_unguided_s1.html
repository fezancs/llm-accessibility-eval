<!DOCTYPE html>
<html>
<head>
  <title>Flu Vaccine Eligibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input, button {
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
    }
    #message {
      margin-top: 20px;
      font-size: 18px;
      color: green;
    }
  </style>
</head>
<body>
  <form id="vaccineForm">
    <label for="age">Age:</label>
    <input type="number" id="age" required>
    <label for="postcode">Postcode:</label>
    <input type="text" id="postcode" required>
    <button type="submit">Check eligibility</button>
  </form>
  <div id="message"></div>
  <script>
    document.getElementById('vaccineForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const age = parseInt(document.getElementById('age').value);
      const messageDiv = document.getElementById('message');
      if (age >= 65) {
        messageDiv.textContent = 'You are eligible for a free flu vaccination.';
      } else {
        messageDiv.textContent = 'You are not eligible for a free flu vaccination.';
      }
    });
  </script>
</body>
</html>
