<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CityCare Appointment Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .error {
      color: red;
      font-size: 0.9em;
      display: none;
    }
    .button-container {
      text-align: center;
    }
    button {
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>CityCare Appointment Request</h2>
    <form onsubmit="return validateForm()" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" aria-describedby="fullNameError" required>
        <div class="error" id="fullNameError">Full name is required.</div>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" aria-describedby="dobError" required>
        <div class="error" id="dobError">Date of birth is required.</div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" aria-describedby="emailError" required>
        <div class="error" id="emailError">Email is required.</div>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" aria-describedby="phoneError">
        <div class="error" id="phoneError">Phone number is optional.</div>
      </div>
      <div class="form-group">
        <label for="clinic">Preferred Clinic</label>
        <select id="clinic" name="clinic" aria-describedby="clinicError">
          <option value="">Select a clinic</option>
          <option value="Northside">Northside</option>
          <option value="Riverside">Riverside</option>
          <option value="Old Town">Old Town</option>
          <option value="Harbour">Harbour</option>
        </select>
        <div class="error" id="clinicError">Please select a clinic.</div>
      </div>
      <div class="form-group">
        <label for="consultation">Consultation Type</label>
        <select id="consultation" name="consultation">
          <option value="">Select type</option>
          <option value="in person">In Person</option>
          <option value="video call">Video Call</option>
          <option value="phone call">Phone Call</option>
        </select>
      </div>
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4" aria-describedby="notesError"></textarea>
        <div class="error" id="notesError">Notes are optional.</div>
      </div>
      <div class="form-group">
        <label for="privacy">
          <input type="checkbox" id="privacy" name="privacy" aria-describedby="privacyError">
          I agree to the privacy notice.
        </label>
        <div class="error" id="privacyError">You must agree to the privacy notice.</div>
      </div>
      <div class="button-container">
        <button type="submit">Request Appointment</button>
      </div>
    </form>
  </div>

  <script>
    function validateForm() {
      let valid = true;

      // Full Name
      const fullName = document.getElementById('fullName');
      const fullNameError = document.getElementById('fullNameError');
      if (fullName.value.trim() === '') {
        fullNameError.textContent = 'Full name is required.';
        fullNameError.style.display = 'block';
        valid = false;
      } else {
        fullNameError.textContent = '';
        fullNameError.style.display = 'none';
      }

      // Date of Birth
      const dob = document.getElementById('dob');
      const dobError = document.getElementById('dobError');
      if (dob.value.trim() === '') {
        dobError.textContent = 'Date of birth is required.';
        dobError.style.display = 'block';
        valid = false;
      } else {
        dobError.textContent = '';
        dobError.style.display = 'none';
      }

      // Email
      const email = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      if (email.value.trim() === '') {
        emailError.textContent = 'Email is required.';
        emailError.style.display = 'block';
        valid = false;
      } else {
        emailError.textContent = '';
        emailError.style.display = 'none';
      }

      // Clinic
      const clinic = document.getElementById('clinic');
      const clinicError = document.getElementById('clinicError');
      if (clinic.value === '') {
        clinicError.textContent = 'Please select a clinic.';
        clinicError.style.display = 'block';
        valid = false;
      } else {
        clinicError.textContent = '';
        clinicError.style.display = 'none';
      }

      // Privacy checkbox
      const privacy = document.getElementById('privacy');
      const privacyError = document.getElementById('privacyError');
      if (!privacy.checked) {
        privacyError.textContent = 'You must agree to the privacy notice.';
        privacyError.style.display = 'block';
        valid = false;
      } else {
        privacyError.textContent = '';
        privacyError.style.display = 'none';
      }

      return valid;
    }
  </script>
</body>
</html>
