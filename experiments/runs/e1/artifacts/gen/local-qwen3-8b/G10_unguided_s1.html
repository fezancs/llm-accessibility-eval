<!DOCTYPE html>
<html>
<head>
  <style>
    /* Custom toggle switch styling */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* Settings panel styling */
    #settings-panel {
      padding: 20px;
      font-family: Arial, sans-serif;
      max-width: 300px;
      margin: 50px auto;
    }
    .toggle {
      margin-bottom: 15px;
    }
    .toggle span {
      margin-left: 10px;
    }

    /* Large text mode effect */
    body.large-text {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div id="settings-panel">
    <div class="toggle">
      <label class="toggle-switch" for="sms-toggle">
        <input type="checkbox" id="sms-toggle">
        <span class="slider"></span>
      </label>
      <span>SMS reminders</span>
    </div>
    <div class="toggle">
      <label class="toggle-switch" for="email-toggle">
        <input type="checkbox" id="email-toggle">
        <span class="slider"></span>
      </label>
      <span>Email reminders</span>
    </div>
    <div class="toggle">
      <label class="toggle-switch" for="large-text-toggle">
        <input type="checkbox" id="large-text-toggle">
        <span class="slider"></span>
      </label>
      <span>Large text mode</span>
    </div>
  </div>

  <script>
    // Large text mode toggle
    document.getElementById('large-text-toggle').addEventListener('change', function() {
      if (this.checked) {
        document.body.classList.add('large-text');
      } else {
        document.body.classList.remove('large-text');
      }
    });
  </script>
</body>
</html>
