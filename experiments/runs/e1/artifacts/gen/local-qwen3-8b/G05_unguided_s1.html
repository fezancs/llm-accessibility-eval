<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityCare</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      color: white;
      padding: 10px 20px;
    }

    .logo {
      font-size: 1.5em;
    }

    nav {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      position: relative;
      margin-left: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #444;
      min-width: 160px;
      z-index: 1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .menu-btn {
      display: none;
      background-color: #555;
      border: none;
      color: white;
      padding: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      nav {
        display: none;
      }
      .menu-btn {
        display: block;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CityCare</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li class="dropdown">
          <a href="#">Services</a>
          <ul class="dropdown-content">
            <li><a href="#">Vaccinations</a></li>
            <li><a href="#">Check-ups</a></li>
            <li><a href="#">Pharmacy</a></li>
            <li><a href="#">Mental Health</a></li>
          </ul>
        </li>
        <li><a href="#">Appointments</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <button class="menu-btn">☰</button>
  </header>

  <script>
    document.querySelector('.menu-btn').addEventListener('click', function() {
      const nav = document.querySelector('nav');
      nav.style.display = nav.style.display === 'none' ? 'flex' : 'none';
    });
  </script>
</body>
</html>
