<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch: how to use the patient portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        section {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .video-container {
            text-align: center;
            margin-top: 20px;
        }
        video {
            width: 100%;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 6px;
        }
        .transcript-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 16px;
            color: #007BFF;
            text-decoration: none;
        }
        .transcript-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <section>
        <h2>Watch: how to use the patient portal</h2>
        <div class="video-container">
            <video controls>
                <source src="media/portal.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <a href="transcript.html" class="transcript-link">View transcript</a>
        </div>
    </section>
    <script>
        // Optional inline JavaScript (no functionality needed)
    </script>
</body>
</html>
