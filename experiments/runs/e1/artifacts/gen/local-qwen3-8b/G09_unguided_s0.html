<!DOCTYPE html>
<html>
<head>
    <title>CityCare Services Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f4f4f4;
        }
        .search-container {
            position: relative;
            width: 300px;
        }
        #serviceSearch {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .suggestions {
            position: absolute;
            width: 100%;
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            z-index: 10;
            display: none;
            margin-top: 5px;
            border-radius: 4px;
        }
        .suggestion {
            padding: 10px;
            cursor: pointer;
        }
        .suggestion:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="serviceSearch" placeholder="Search for a service...">
        <div class="suggestions" id="suggestions"></div>
    </div>
    <script>
        const services = ["Vaccinations", "Blood tests", "Physiotherapy", "Pharmacy", "Dental care", "Eye tests", "Hearing tests", "Mental health", "Maternity", "Child health", "Travel clinic", "Sexual health"];
        const input = document.getElementById('serviceSearch');
        const suggestions = document.getElementById('suggestions');

        input.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filtered = services.filter(service => service.toLowerCase().includes(query));
            suggestions.innerHTML = '';
            if (filtered.length > 0) {
                suggestions.style.display = 'block';
                filtered.forEach(service => {
                    const div = document.createElement('div');
                    div.className = 'suggestion';
                    div.textContent = service;
                    div.onclick = function() {
                        input.value = service;
                        suggestions.style.display = 'none';
                    };
                    suggestions.appendChild(div);
                });
            } else {
                suggestions.style.display = 'none';
            }
        });
    </script>
</body>
</html>
