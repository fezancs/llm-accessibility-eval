<!DOCTYPE html>
<html>
<head>
    <title>Our Facilities Gallery</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
        }
        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 900px;
            height: auto;
        }
        .caption {
            color: #fff;
            padding: 15px;
            text-align: center;
            background-color: rgba(0,0,0,0.7);
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <img src="images/reception.jpg" data-caption="Reception Area" onclick="openModal(this)">
        <img src="images/play-area.jpg" data-caption="Play Area" onclick="openModal(this)">
        <img src="images/step-free-entrance.jpg" data-caption="Step-Free Entrance" onclick="openModal(this)">
        <img src="images/pharmacy-counter.jpg" data-caption="Pharmacy Counter" onclick="openModal(this)">
        <img src="images/waiting-room.jpg" data-caption="Waiting Room" onclick="openModal(this)">
        <img src="images/garden.jpg" data-caption="Garden" onclick="openModal(this)">
    </div>

    <div class="modal" id="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg" src="" alt="Large Image">
        <div class="caption" id="caption"></div>
    </div>

    <script>
        function openModal(img) {
            var modal = document.getElementById("modal");
            var modalImg = document.getElementById("modalImg");
            var captionText = document.getElementById("caption");
            modal.style.display = "block";
            modalImg.src = img.src;
            captionText.innerHTML = img.getAttribute("data-caption");
        }

        function closeModal() {
            var modal = document.getElementById("modal");
            modal.style.display = "none";
        }
    </script>
</body>
</html>
