<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Portal Tutorial</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    section {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }
    h2 {
      margin-bottom: 10px;
      color: #333;
    }
    video {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .transcript-link {
      font-weight: bold;
      color: #0066cc;
      text-decoration: none;
    }
    .transcript-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <section>
    <h2 id="video-heading">Watch: how to use the patient portal</h2>
    <video controls aria-labelledby="video-heading" role="region" aria-roledescription="Video tutorial">
      <source src="media/portal.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <p>
      <a href="transcript.html" class="transcript-link" aria-label="Text transcript for the video tutorial">View transcript</a>
    </p>
  </section>
</body>
</html>
