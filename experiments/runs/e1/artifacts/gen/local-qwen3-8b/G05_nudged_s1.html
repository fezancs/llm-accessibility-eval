<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityCare</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #f8f8f8;
      border-bottom: 1px solid #ccc;
    }
    .logo {
      font-size: 1.5em;
      font-weight: bold;
    }
    .main-nav {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .main-nav li {
      position: relative;
      margin-left: 2rem;
    }
    .main-nav li a {
      text-decoration: none;
      color: #333;
      padding: 0.5rem 0.75rem;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      min-width: 150px;
    }
    .dropdown:hover .dropdown-menu {
      display: block;
    }
    .dropdown-menu.active {
      display: block;
    }
    @media (max-width: 600px) {
      .main-nav {
        display: none;
      }
      .menu-button {
        display: block;
      }
    }
    .menu-button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5em;
      padding: 10px;
    }
    .menu-button:focus {
      outline: 2px solid #000;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CityCare</div>
    <nav class="main-nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li class="dropdown" id="services" aria-expanded="false">
          <a href="#" role="button">Services</a>
          <ul class="dropdown-menu" role="menu" aria-labelledby="services">
            <li><a href="#">Vaccinations</a></li>
            <li><a href="#">Check-ups</a></li>
            <li><a href="#">Pharmacy</a></li>
            <li><a href="#">Mental health</a></li>
          </ul>
        </li>
        <li><a href="#">Appointments</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <button class="menu-button" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </header>

  <script>
    const menuButton = document.querySelector('.menu-button');
    const nav = document.querySelector('.main-nav');

    menuButton.addEventListener('click', function() {
      nav.classList.toggle('active');
      this.setAttribute('aria-expanded', nav.classList.contains('active'));
    });

    document.querySelectorAll('.dropdown').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const menu = this.querySelector('.dropdown-menu');
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        if (menu) {
          menu.classList.toggle('active');
        }
      });
    });

    document.querySelectorAll('.dropdown').forEach(item => {
      item.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const menu = this.querySelector('.dropdown-menu');
          const expanded = this.getAttribute('aria-expanded') === 'true';
          this.setAttribute('aria-expanded', !expanded);
          if (menu) {
            menu.classList.toggle('active');
          }
        }
      });
    });
  </script>
</body>
</html>
