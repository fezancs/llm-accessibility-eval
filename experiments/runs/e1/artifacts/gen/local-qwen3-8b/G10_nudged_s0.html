<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <style>
    body {
      font-size: 16px;
      color: #000;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .settings-panel {
      padding: 20px;
      max-width: 300px;
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }
    .toggle {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .toggle label {
      flex: 1;
      padding: 10px;
      background-color: #ccc;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      color: #000;
      transition: background-color 0.2s;
    }
    .toggle input:checked + label {
      background-color: #00ff00;
    }
    body.large-text {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div class="settings-panel">
    <div class="toggle">
      <input type="checkbox" id="sms">
      <label for="sms">SMS reminders</label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="email">
      <label for="email">Email reminders</label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="largeText">
      <label for="largeText">Large text mode</label>
    </div>
  </div>

  <script>
    document.getElementById('largeText').addEventListener('change', function() {
      if (this.checked) {
        document.body.classList.add('large-text');
      } else {
        document.body.classList.remove('large-text');
      }
    });
  </script>
</body>
</html>
