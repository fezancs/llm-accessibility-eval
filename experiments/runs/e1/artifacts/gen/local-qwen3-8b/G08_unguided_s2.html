<!DOCTYPE html>
<html>
<head>
    <style>
        .banner {
            position: relative;
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }
        .slide.active {
            display: block;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="slide">Flu vaccinations are now available</div>
        <div class="slide">New evening hours at Riverside</div>
        <div class="slide">Download the CityCare app</div>
    </div>
    <button id="prev">Previous</button>
    <button id="next">Next</button>
    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === index) {
                    slide.classList.add('active');
                }
            });
        }

        showSlide(currentIndex);

        setInterval(() => {
            currentIndex = (currentIndex + 1) % totalSlides;
            showSlide(currentIndex);
        }, 5000);

        document.getElementById('next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % totalSlides;
            showSlide(currentIndex);
        });

        document.getElementById('prev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            showSlide(currentIndex);
        });
    </script>
</body>
</html>
