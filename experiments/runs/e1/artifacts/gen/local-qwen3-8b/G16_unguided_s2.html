<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient ID Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .input-container {
      position: relative;
      display: inline-block;
    }
    .input-container input {
      padding: 8px;
      width: 200px;
    }
    .tooltip-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: help;
      font-size: 16px;
    }
    .tooltip {
      position: absolute;
      right: 10px;
      top: 100%;
      background: #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      display: none;
      white-space: nowrap;
      z-index: 10;
    }
    .tooltip-icon:hover + .tooltip {
      display: block;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="patient-id">Patient ID number</label>
    <div class="input-container">
      <input type="text" id="patient-id" name="patient-id" placeholder="Enter patient ID">
      <span class="tooltip-icon">?</span>
      <div class="tooltip">Your 10-digit patient ID is printed on your clinic card.</div>
    </div>
  </div>
</body>
</html>
