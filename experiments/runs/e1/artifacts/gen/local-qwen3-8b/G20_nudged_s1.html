<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CityCare Footer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background-color: #1e1e1e;
    }
    footer {
      background-color: #1e1e1e;
      color: #fff;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .contact-info, .newsletter {
      flex: 1 1 100%;
      min-width: 200px;
    }
    .social-icons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .social-icons a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
    }
    .newsletter form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .newsletter input {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: #fff;
    }
    .newsletter button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background-color: #1877F2;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .newsletter button:hover {
      background-color: #1557B0;
    }
    .social-icons svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <footer>
    <div class="footer-content">
      <div class="contact-info">
        <p>1 Market Street, Old Town</p>
        <p>Phone: (123) 456-7890</p>
        <p>Email: info@citycare.org</p>
      </div>
      <div class="social-icons">
        <a href="https://facebook.com/citycare" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#1877F2"/>
            <text x="12" y="14" text-anchor="middle" fill="white" font-size="16" font-family="Arial">f</text>
          </svg>
        </a>
        <a href="https://twitter.com/citycare" aria-label="Twitter">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-1.67 3.12 4.48 4.48 0 0 0 7.86 3 10.9 10.9 0 0 1-3.14-1.53 4.48 4.48 0 0 0 0-7.86 10.9 10.9 0 0 1-3.14-1.53 4.48 4.48 0 0 0 7.86-3 10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0 0 7.86 10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0 7.86 3z" fill="#1DA1F2"/>
          </svg>
        </a>
        <a href="https://instagram.com/citycare" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-8.118-1.128-11.584-3.275 1.111.188 2.23.268 3.352.288-3.119-2.643-6.695-3.338-10.29-3.338-3.205 0-5.963 2.144-7.623 4.798-1.257-.027-2.376-.215-3.434-.555 1.481.18 2.985.237 4.508.237 3.391 0 6.387-2.122 7.353-4.765-1.338-.328-2.826-.395-4.134-.395-3.135 0-5.516 2.365-4.797 5.517-4.091-.205-8.118-1.128-11.584-3.275 1.111.188 2.23.268 3.352.288z" fill="#E1306C"/>
          </svg>
        </a>
        <a href="https://youtube.com/citycare" aria-label="YouTube">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#FF0000"/>
            <path d="M8 12h8l-3-3v6z" fill="white"/>
          </svg>
        </a>
      </div>
      <div class="newsletter">
        <form action="#" method="post">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required aria-label="Email address" placeholder="Email address" />
          <button type="submit">Subscribe</button>
        </form>
      </div>
    </div>
  </footer>
</body>
</html>
