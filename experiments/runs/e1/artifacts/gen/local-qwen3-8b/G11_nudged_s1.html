<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pain Scale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fff;
            color: #333;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        #painSlider {
            width: 200px;
        }
        #painValue {
            font-weight: bold;
            min-width: 30px;
        }
    </style>
</head>
<body>
    <h1>Pain Scale</h1>
    <div class="slider-container">
        <label for="painSlider">Pain Level:</label>
        <input type="range" id="painSlider" min="0" max="10" step="1" aria-valuemin="0" aria-valuemax="10">
        <span id="painValue">0</span>
    </div>

    <script>
        const slider = document.getElementById('painSlider');
        const valueDisplay = document.getElementById('painValue');

        function updateValueDisplay() {
            const value = slider.value;
            valueDisplay.textContent = value;
            slider.setAttribute('aria-valuenow', value);
        }

        slider.addEventListener('input', updateValueDisplay);
        window.onload = () => {
            updateValueDisplay();
        };
    </script>
</body>
</html>
