<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Facilities Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .gallery-item {
      flex: 1 1 calc(33.33% - 20px);
      min-width: 200px;
      text-align: center;
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 8px;
    }
    .gallery-item .caption {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay {
      position: relative;
      width: 80%;
      max-width: 800px;
      max-height: 600px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    .modal-overlay img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 30px;
      cursor: pointer;
      color: white;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="gallery-item">
      <img src="images/reception.jpg" alt="Reception" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Reception Area</p>
    </div>
    <div class="gallery-item">
      <img src="images/play-area.jpg" alt="Play Area" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Play Area</p>
    </div>
    <div class="gallery-item">
      <img src="images/step-free-entrance.jpg" alt="Step-free Entrance" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Step-free Entrance</p>
    </div>
    <div class="gallery-item">
      <img src="images/pharmacy-counter.jpg" alt="Pharmacy Counter" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Pharmacy Counter</p>
    </div>
    <div class="gallery-item">
      <img src="images/waiting-room.jpg" alt="Waiting Room" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Waiting Room</p>
    </div>
    <div class="gallery-item">
      <img src="images/garden.jpg" alt="Garden" onclick="openModal(this.src); event.stopPropagation();">
      <p class="caption">Garden</p>
    </div>
  </div>
  <div id="modal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-overlay" onclick="closeModal()">
      <img id="modal-img" src="" alt="Large image">
    </div>
  </div>
  <script>
    function openModal(src) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
