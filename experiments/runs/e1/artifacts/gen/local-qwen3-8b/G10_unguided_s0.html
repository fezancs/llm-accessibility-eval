<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      padding: 20px;
    }
    .settings-panel {
      max-width: 300px;
      margin: auto;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
      margin: 10px 0;
    }
    .toggle input {
      display: none;
    }
    .toggle span {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .toggle input:checked + span {
      background-color: #2196F3;
    }
    .toggle span:before {
      content: "";
      position: absolute;
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    .toggle input:checked + span:before {
      transform: translateX(26px);
    }
    .large-text {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div class="settings-panel">
    <label class="toggle">
      <input type="checkbox" id="sms">
      <span>SMS reminders</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="email">
      <span>Email reminders</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="largeText">
      <span>Large text mode</span>
    </label>
  </div>

  <script>
    document.getElementById('largeText').addEventListener('change', function() {
      if (this.checked) {
        document.body.classList.add('large-text');
      } else {
        document.body.classList.remove('large-text');
      }
    });
  </script>
</body>
</html>
