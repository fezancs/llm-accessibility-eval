<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient ID Form</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      display: flex;
      align-items: center;
      font-size: 16px;
    }
    .tooltip-icon {
      cursor: help;
      margin-left: 5px;
      font-size: 16px;
      position: relative;
      top: 2px;
    }
    .tooltip-icon::after {
      content: attr(title);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      white-space: nowrap;
      font-size: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 10;
    }
    .tooltip-icon:hover::after {
      opacity: 1;
      visibility: visible;
    }
    input {
      padding: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <form>
    <label for="patient-id">Patient ID number</label>
    <div>
      <input type="text" id="patient-id" name="patient-id" required>
      <span class="tooltip-icon" title="Your 10-digit patient ID is printed on your clinic card.">?</span>
    </div>
  </form>
</body>
</html>
