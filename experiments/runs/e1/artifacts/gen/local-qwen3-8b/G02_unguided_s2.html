<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .appointment-card {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            margin: 0 auto;
            text-align: center;
        }
        .appointment-card button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal div {
            background: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .modal button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .modal button:first-child {
            background-color: #e74c3c;
            color: white;
        }
        .modal button:last-child {
            background-color: #3498db;
            color: white;
        }
        #cancelMessage {
            display: none;
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="appointment-card">
        <p>Tuesday 12 March, 10:30</p>
        <p>Riverside clinic</p>
        <button onclick="openModal()">Cancel appointment</button>
    </div>

    <div class="modal" id="modal">
        <div>
            <p>Are you sure you want to cancel your appointment on 12 March at 10:30?</p>
            <button onclick="confirmCancel()">Yes, cancel</button>
            <button onclick="closeModal()">Keep appointment</button>
        </div>
    </div>

    <p id="cancelMessage">Your appointment has been cancelled.</p>

    <script>
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function confirmCancel() {
            closeModal();
            document.getElementById('cancelMessage').style.display = 'block';
        }
    </script>
</body>
</html>
