<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CityCare Services Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1em;
        }
        #searchBox {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.3s;
        }
        #searchBox:focus {
            border-color: #007bff;
        }
        #suggestions {
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 1000;
            display: none;
            margin-top: 5px;
        }
        #suggestions div {
            padding: 8px;
            cursor: pointer;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }
        #suggestions div:focus {
            outline: none;
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <label for="searchBox">Search for CityCare services:</label>
    <input type="text" id="searchBox" aria-label="Search for CityCare services">
    <div id="suggestions" role="listbox" aria-expanded="false"></div>
    <script>
        const services = ["Vaccinations", "Blood tests", "Physiotherapy", "Pharmacy", "Dental care", "Eye tests", "Hearing tests", "Mental health", "Maternity", "Child health", "Travel clinic", "Sexual health"];
        const searchBox = document.getElementById('searchBox');
        const suggestionsContainer = document.getElementById('suggestions');

        function updateSuggestions(filtered) {
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.setAttribute('aria-expanded', filtered.length > 0 ? 'true' : 'false');
            if (filtered.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            suggestionsContainer.style.display = 'block';
            filtered.forEach(service => {
                const div = document.createElement('div');
                div.textContent = service;
                div.setAttribute('role', 'option');
                div.setAttribute('tabindex', '0');
                div.addEventListener('click', () => {
                    searchBox.value = service;
                    suggestionsContainer.style.display = 'none';
                });
                suggestionsContainer.appendChild(div);
            });
            // Focus the first suggestion if there are any
            if (filtered.length > 0) {
                suggestionsContainer.querySelector('div')?.focus();
            }
        }

        searchBox.addEventListener('input', () => {
            const query = searchBox.value.trim().toLowerCase();
            const filtered = services.filter(service => service.toLowerCase().includes(query));
            updateSuggestions(filtered);
        });

        suggestionsContainer.addEventListener('keydown', (e) => {
            const items = suggestionsContainer.querySelectorAll('[role="option"]');
            if (items.length === 0) return;

            let currentIndex = Array.from(items).indexOf(document.activeElement);
            if (currentIndex === -1) currentIndex = 0;

            switch (e.key) {
                case 'ArrowDown':
                    currentIndex = (currentIndex + 1) % items.length;
                    break;
                case 'ArrowUp':
                    currentIndex = (currentIndex - 1 + items.length) % items.length;
                    break;
                case 'Enter':
                    if (currentIndex >= 0 && currentIndex < items.length) {
                        const selected = items[currentIndex];
                        searchBox.value = selected.textContent;
                        suggestionsContainer.style.display = 'none';
                    }
                    return;
                default:
                    return;
            }

            items[currentIndex].focus();
        });
    </script>
</body>
</html>
