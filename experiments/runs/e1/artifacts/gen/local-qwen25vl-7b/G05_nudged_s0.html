<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .nav-container button {
            background-color: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 10px 20px;
            transition: background-color 0.3s;
        }
        .nav-container button:hover {
            background-color: #555;
        }
        .nav-container .nav-items {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-container .nav-items a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            transition: background-color 0.3s;
        }
        .nav-container .nav-items a:hover {
            background-color: #555;
        }
        .nav-container .nav-items .dropdown {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .nav-container .nav-items .dropdown a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
        }
        .nav-container .nav-items .dropdown a:hover {
            background-color: #f1f1f1;
        }
        @media (max-width: 600px) {
            .nav-container .nav-items {
                display: none;
            }
            .nav-container button {
                display: block;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="#" class="logo">CityCare</a>
            <button onclick="toggleNav()">Menu</button>
            <div class="nav-items">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">Appointments</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </header>
    <div id="nav" class="nav">
        <div class="nav-items">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Appointments</a>
            <a href="#">Contact</a>
        </div>
        <div class="nav-items dropdown">
            <a href="#">Services</a>
            <a href="#">Vaccinations</a>
            <a href="#">Check-ups</a>
            <a href="#">Pharmacy</a>
            <a href="#">Mental health</a>
        </div>
    </div>
    <script>
        function toggleNav() {
            var nav = document.getElementById("nav");
            if (nav.style.display === "block") {
                nav.style.display = "none";
            } else {
                nav.style.display = "block";
            }
        }
    </script>
</body>
</html>
