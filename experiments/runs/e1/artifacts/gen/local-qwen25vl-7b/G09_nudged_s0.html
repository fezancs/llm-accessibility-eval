<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityCare Services Search</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  .search-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .search-box {
    position: relative;
    width: 300px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }
  .search-box::placeholder {
    color: #ccc;
  }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background-color: white;
    border: 1px solid #ccc;
    border-top: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    list-style-type: none;
    padding: 0;
    margin: 0;
  }
  .suggestions li {
    padding: 10px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .suggestions li:hover {
    background-color: #f0f0f0;
  }
</style>
<script>
  const services = [
    "Vaccinations",
    "Blood tests",
    "Physiotherapy",
    "Pharmacy",
    "Dental care",
    "Eye tests",
    "Hearing tests",
    "Mental health",
    "Maternity",
    "Child health",
    "Travel clinic",
    "Sexual health"
  ];

  function searchService(query) {
    const suggestions = document.querySelector('.suggestions');
    suggestions.innerHTML = '';
    const filteredServices = services.filter(service => service.toLowerCase().includes(query.toLowerCase()));
    filteredServices.forEach(service => {
      const li = document.createElement('li');
      li.textContent = service;
      li.addEventListener('click', () => {
        document.querySelector('.search-box').value = service;
        suggestions.style.display = 'none';
      });
      suggestions.appendChild(li);
    });
  }

  document.querySelector('.search-box').addEventListener('input', (event) => {
    searchService(event.target.value);
  });
</script>
</head>
<body>
<div class="search-container">
  <input class="search-box" type="text" placeholder="Search CityCare services...">
  <ul class="suggestions"></ul>
</div>
</body>
</html>
