<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCare Footer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
        }
        footer {
            background-color: #fff;
            color: #333;
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ddd;
        }
        footer a, footer a:hover {
            color: #333;
            text-decoration: none;
        }
        footer a svg {
            width: 24px;
            height: 24px;
            margin: 0 10px;
        }
        .newsletter-form {
            display: inline-block;
            margin: 0 auto;
            width: 300px;
            text-align: center;
        }
        .newsletter-form input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .newsletter-form button[type="submit"] {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .newsletter-form button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <footer>
        <div class="footer-content">
            <p>CityCare<br>1 Market Street, Old Town</p>
            <p><a href="tel:1234567890">123-456-7890</a></p>
            <p><a href="mailto:info@citycare.com">info@citycare.com</a></p>
            <div class="social-media">
                <a href="https://facebook.com/citycare"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M439.256 278.06l12.705-12.68c6.165-6.124 6.165-15.882 0-21.996z"/></svg></a>
                <a href="https://twitter.com/citycare"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M439.256 278.06l12.705-12.68c6.165-6.124 6.165-15.882 0-21.996z"/></svg></a>
                <a href="https://instagram.com/citycare"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M439.256 278.06l12.705-12.68c6.165-6.124 6.165-15.882 0-21.996z"/></svg></a>
                <a href="https://youtube.com/citycare"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M439.256 278.06l12.705-12.68c6.165-6.124 6.165-15.882 0-21.996z"/></svg></a>
            </div>
            <div class="newsletter-form">
                <input type="email" placeholder="Enter your email">
                <button type="submit">Subscribe</button>
            </div>
        </div>
    </footer>
</body>
</html>
