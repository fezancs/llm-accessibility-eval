<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flu Vaccine Eligibility Checker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    text-align: center;
    background-color: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }
  .result {
    margin-top: 20px;
    font-size: 1.2em;
    color: #555;
  }
</style>
</head>
<body>
<div class="container">
  <form>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required>
    <label for="postcode">Postcode:</label>
    <input type="text" id="postcode" name="postcode" required>
    <button type="button" onclick="checkEligibility()">Check Eligibility</button>
  </form>
  <div id="result" class="result"></div>
</div>
<script>
function checkEligibility() {
  const age = document.getElementById('age').value;
  const postcode = document.getElementById('postcode').value;
  const resultDiv = document.getElementById('result');
  resultDiv.textContent = '';

  if (age >= 65) {
    resultDiv.textContent = 'You are eligible for a free flu vaccination.';
  } else {
    resultDiv.textContent = 'You are not eligible for a free flu vaccination.';
  }
}
</script>
</body>
</html>
