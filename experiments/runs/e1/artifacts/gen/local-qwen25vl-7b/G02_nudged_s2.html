<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Details</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  .appointment-card {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }
  .appointment-card h2 {
    margin: 0 0 10px;
  }
  .appointment-card button {
    margin: 10px 0;
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
  }
  .appointment-card button:hover {
    background-color: #f0f0f0;
  }
  .appointment-card button:active {
    background-color: #e0e0e0;
  }
  .appointment-card .modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.4);
  }
  .appointment-card .modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
  }
  .appointment-card .modal-content h3 {
    margin: 0 0 10px;
  }
  .appointment-card .modal-content button {
    margin: 10px 0;
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
  }
  .appointment-card .modal-content button:hover {
    background-color: #f0f0f0;
  }
  .appointment-card .modal-content button:active {
    background-color: #e0e0e0;
  }
</style>
</head>
<body>
<div class="appointment-card">
  <h2>Appointment Details</h2>
  <p>On Tuesday, 12 March at 10:30, at Riverside Clinic.</p>
  <button id="cancel-btn">Cancel Appointment</button>
</div>

<div class="modal" id="cancel-modal">
  <div class="modal-content">
    <h3>Are you sure you want to cancel your appointment on 12 March at 10:30?</h3>
    <button id="yes-cancel-btn">Yes, cancel</button>
    <button id="keep-btn">Keep appointment</button>
  </div>
</div>

<script>
  document.getElementById('cancel-btn').addEventListener('click', function() {
    document.getElementById('cancel-modal').style.display = 'block';
  });

  document.getElementById('yes-cancel-btn').addEventListener('click', function() {
    document.getElementById('cancel-modal').style.display = 'none';
    document.getElementById('yes-cancel-btn').innerText = 'Your appointment has been cancelled.';
  });

  document.getElementById('keep-btn').addEventListener('click', function() {
    document.getElementById('cancel-modal').style.display = 'none';
  });
</script>
</body>
</html>
