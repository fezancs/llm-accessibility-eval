<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flu Vaccine Eligibility Checker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    text-align: center;
    background-color: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }
  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .input-group input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    width: 150px;
  }
  .button {
    padding: 10px 20px;
    border: none;
    background-color: #007bff;
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .button:hover {
    background-color: #0056b3;
  }
  .message {
    margin-top: 20px;
    font-size: 16px;
    color: #555;
  }
</style>
</head>
<body>
<div class="container">
  <div class="input-group">
    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Enter your age">
  </div>
  <div class="input-group">
    <label for="postcode">Postcode:</label>
    <input type="text" id="postcode" placeholder="Enter your postcode">
  </div>
  <button class="button" onclick="checkEligibility()">Check Eligibility</button>
  <div class="message" id="message"></div>
</div>
<script>
function checkEligibility() {
  const age = document.getElementById('age').value;
  const postcode = document.getElementById('postcode').value;
  const messageElement = document.getElementById('message');
  messageElement.textContent = '';

  if (age >= 65) {
    messageElement.textContent = 'You are eligible for a free flu vaccination.';
  } else {
    messageElement.textContent = 'You are not eligible for a free flu vaccination.';
  }
}
</script>
</body>
</html>
