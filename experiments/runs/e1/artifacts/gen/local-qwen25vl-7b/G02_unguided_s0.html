<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Details</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgb(0,0,0);
    background-color: rgba(0,0,0,0.4);
  }
  .modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
  }
</style>
</head>
<body>
  <div id="appointmentDetails">
    <h2>Appointment Details</h2>
    <p>On Tuesday, 12 March at 10:30, at Riverside Clinic</p>
    <button id="cancelButton">Cancel Appointment</button>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <p>Are you sure you want to cancel your appointment on 12 March at 10:30?</p>
      <button id="yesButton">Yes, cancel</button>
      <button id="keepButton">Keep appointment</button>
    </div>
  </div>

  <script>
    document.getElementById('cancelButton').addEventListener('click', function() {
      document.getElementById('modal').style.display = 'block';
    });

    document.getElementById('yesButton').addEventListener('click', function() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('appointmentDetails').innerHTML += '<p>Your appointment has been cancelled.</p>';
    });

    document.getElementById('keepButton').addEventListener('click', function() {
      document.getElementById('modal').style.display = 'none';
    });
  </script>
</body>
</html>
