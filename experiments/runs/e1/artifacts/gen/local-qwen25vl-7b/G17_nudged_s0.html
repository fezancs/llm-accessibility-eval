<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referral Letter Upload</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  .upload-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .upload-area .file-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upload-area .file-list .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f9f9f9;
  }
  .upload-area .file-list .file-item .remove-button {
    cursor: pointer;
    font-size: 1.5em;
    color: #ff0000;
  }
  .upload-area .file-list .file-item .remove-button:hover {
    color: #ff4d4d;
  }
</style>
<script>
  function handleFileUpload(event) {
    const files = event.target.files;
    const fileList = document.querySelector('.file-list');
    for (let file of files) {
      const fileItem = document.createElement('div');
      fileItem.classList.add('file-item');
      fileItem.textContent = file.name;
      fileItem.dataset.size = file.size;
      fileItem.appendChild(document.createElement('span'));
      fileItem.querySelector('span').classList.add('remove-button');
      fileItem.querySelector('span').textContent = 'x';
      fileItem.querySelector('span').addEventListener('click', () => {
        fileList.removeChild(fileItem);
      });
      fileItem.querySelector('span').addEventListener('mouseover', () => {
        fileItem.querySelector('span').style.color = '#ff4d4d';
      });
      fileItem.querySelector('span').addEventListener('mouseout', () => {
        fileItem.querySelector('span').style.color = '#ff0000';
      });
      fileList.appendChild(fileItem);
    }
  }
</script>
</head>
<body>
<div class="upload-area">
  <input type="file" multiple onchange="handleFileUpload(event)" />
  <div class="file-list"></div>
</div>
</body>
</html>
