    <meta charset="UTF-8">

    <title>CityCare Footer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
            position: relative;
        }
        footer a {
            color: white;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
        .social-icons svg {
            width: 24px;
            height: 24px;
            margin-right: 1rem;
        }
        .newsletter-form {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
        .newsletter-form input[type="email"] {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        .newsletter-form button[type="submit"] {
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .newsletter-form button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
