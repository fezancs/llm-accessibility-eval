<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Scale Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .pain-scale {
            width: 300px;
            margin: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .pain-scale .slider {
            width: 100%;
            height: 40px;
            background-color: #ddd;
            border-radius: 4px;
            position: relative;
        }
        .pain-scale .slider .handle {
            width: 24px;
            height: 24px;
            background-color: #007bff;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 0;
            cursor: ew-resize;
        }
        .pain-scale .slider .handle::before {
            content: attr(data-value);
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="pain-scale">
        <input type="range" min="0" max="10" value="0" step="1" class="slider" data-value="0">
        <div class="handle"></div>
    </div>

    <script>
        document.querySelector('.slider').addEventListener('input', function() {
            this.querySelector('.handle').style.left = (this.value / 10) * 100 + '%';
            this.querySelector('.handle::before').textContent = this.value;
        });
    </script>
</body>
</html>
